name: Linters

on:
  pull_request:
    branches:
      - main
      - staging

jobs:

  isort:
    name: isort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: isort/isort-action@v1.1.1
        with:
          isort-version: "8.0.1"
          configuration: "--check --diff"

  black:
    name: black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: psf/black@stable
        with:
          options: "--check --diff"
          version: "~= 26.0"
