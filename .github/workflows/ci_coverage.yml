name: 'coverage tests Linux'

on:
  push:
    branches:
      - 'main'
      - 'staging'

jobs:
  coverage:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt -y update
        sudo apt -y install libsdl3-dev libva-dev python3-venv gcovr spirv-tools libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
        sudo apt -y install ffmpeg libavcodec-dev libavutil-dev libavformat-dev libavdevice-dev libavfilter-dev libswscale-dev libswresample-dev
        sudo apt -y install libharfbuzz-dev libfribidi-dev

    - name: Cache external archives
      uses: actions/cache@v6
      with:
        path: |
          external/*.tar*
          external/*.zip
        key: externals-linux-${{ hashFiles('configure.py') }}

    - name: Run tests
      run: |
        ./configure.py --buildtype debug --coverage --debug-opts gl vk
        make tests-setup
        . venv/bin/ngli-activate
        meson test -C builddir/tests --timeout-multiplier=3
    - name: Get coverage
      run: |
        set -o pipefail
        make coverage-html | tee coverage.log
        echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
        sed -nE 's/^(lines|functions|branches): /- \1: /p' coverage.log >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage report
        path: builddir/libnopegl/meson-logs/coveragereport
