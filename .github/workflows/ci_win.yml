# Warning: this name must stay in sync with the badges referenced in the README
name: 'tests Windows'

on:
  push:
    branches:
      - 'main'
      - 'staging'
  pull_request:
  schedule:
      - cron: "0 0 * * 6"  # Run every Saturday at midnight

jobs:
  windows:

    runs-on: windows-latest
    env:
        VULKAN_SDK_VERSION: 1.4.328.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_backend: ninja

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.13.5'

      - name: Install dependencies
        run: |
          iwr https://sdk.lunarg.com/sdk/download/${{env.VULKAN_SDK_VERSION}}/windows/vulkansdk-windows-X64-${{env.VULKAN_SDK_VERSION}}.exe -OutFile VulkanSDK-Installer.exe
          .\VulkanSDK-Installer.exe --accept-licenses --default-answer --confirm-command install | Out-Null

          iwr https://sdk.lunarg.com/sdk/download/${{env.VULKAN_SDK_VERSION}}/windows/VulkanRT-X64-${{env.VULKAN_SDK_VERSION}}-Installer.exe -OutFile VulkanRT-Installer.exe
          .\VulkanRT-Installer.exe /S | Out-Null

      # Install Mesa which provides a Vulkan software driver (lavapipe)
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ucrt64
          update: true
          install: mingw-w64-ucrt-x86_64-mesa

      - name: Build (${{matrix.build_backend}})
        run: |
          $Env:VULKAN_SDK = "C:/VulkanSDK/${{env.VULKAN_SDK_VERSION}}"
          .\scripts\msvc-env.ps1
          clang-cl --version
          lld-link --version
          python.exe .\configure.py --debug-opts gpu_capture --build-backend ${{matrix.build_backend}}
          nmake

      - name: Python import and dylib runtime test
        run: |
          .\venv\Scripts\ngli-activate.ps1

          "Shared libraries required by the nopegl library:"
          bash -l -c "ldd venv/Scripts/nopegl-0.dll"

          "Shared libraries required by ngl-python:"
          bash -l -c "ldd venv/Scripts/ngl-python.exe"

          ngl-python.exe -h

          "Shared libraries required by the Cython binding:"
          bash -l -c "ldd python/pynopegl/_pynopegl.*.pyd"

          python.exe -c "import pynopegl, pynopegl_utils"

      - name: Run tests vulkan
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Register lavapipe as a Vulkan system driver so the Vulkan loader can find it
          reg add HKLM\SOFTWARE\Khronos\Vulkan\Drivers /v "${{steps.msys2.outputs.msys2-location}}\ucrt64\share\vulkan\icd.d\lvp_icd.x86_64.json" /t REG_DWORD /d 0 /f
          $Env:VULKAN_SDK = "C:/VulkanSDK/${{env.VULKAN_SDK_VERSION}}"
          .\scripts\msvc-env.ps1
          .\venv\Scripts\ngli-activate.ps1
          ngl-probe.exe -l debug -b vulkan --cap compute
          nmake tests-setup
          meson test -C builddir\tests --timeout-multiplier=3 --suite vulkan

      - name: Upload Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows logs vulkan
          path: builddir/tests/meson-logs/testlog.txt

      - name: Upload Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows report vulkan
          path: builddir/tests/report
